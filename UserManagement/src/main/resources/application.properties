spring.application.name=UserManagement
server.port=9000

# Fallback local datasource configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:microservises}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/

# Optional Config Server import
spring.config.import=optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888

# Fallback JWT secret
jwt.secret=${JWT_SECRET:SuperSecretDefaultKeyForDevelopmentOnly1234567890}