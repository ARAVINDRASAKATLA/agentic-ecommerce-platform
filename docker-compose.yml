services:
  # -----------------------------------------------------------
  # 1. Infrastructure Services: Apache Kafka (KRaft Mode)
  # -----------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------
  # 2. Discovery Service: Netflix Eureka Server (Port 8761)
  # -----------------------------------------------------------
  eureka-service:
    build:
      context: ./EurekaService
      dockerfile: Dockerfile
    container_name: eureka-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network

  # -----------------------------------------------------------
  # 3. User Management & Auth Service (Port 9000)
  # -----------------------------------------------------------
  user-management:
    build:
      context: ./UserManagement
      dockerfile: Dockerfile
    container_name: user-management
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      eureka-service:
        condition: service_started
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql-23d061c1-aravindrasakatla7-b9ba.e.aivencloud.com:19407/defaultdb?sslMode=REQUIRED}
      DB_USERNAME: ${DB_USERNAME:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-service
      JWT_SECRET: ${JWT_SECRET:-SuperSecretDefaultKeyForDevelopmentOnly1234567890}
    networks:
      - ecommerce-network

  # -----------------------------------------------------------
  # 4. Inventory Management Service (Port 8083)
  # -----------------------------------------------------------
  inventory-management:
    build:
      context: ./InventoryManagement
      dockerfile: Dockerfile
    container_name: inventory-management
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      eureka-service:
        condition: service_started
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql-23d061c1-aravindrasakatla7-b9ba.e.aivencloud.com:19407/defaultdb?sslMode=REQUIRED}
      DB_USERNAME: ${DB_USERNAME:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-service
    networks:
      - ecommerce-network

  # -----------------------------------------------------------
  # 5. Product & Order Management Service (Port 8082)
  # -----------------------------------------------------------
  product-management:
    build:
      context: ./ProductManagement
      dockerfile: Dockerfile
    container_name: product-management
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql-23d061c1-aravindrasakatla7-b9ba.e.aivencloud.com:19407/defaultdb?sslMode=REQUIRED}
      DB_USERNAME: ${DB_USERNAME:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_AUTO_STARTUP: "true"
    networks:
      - ecommerce-network

  # -----------------------------------------------------------
  # 6. Delivery & Driver Fleet Management Service (Port 8084)
  # -----------------------------------------------------------
  delivery-management:
    build:
      context: ./DeliveryManagement
      dockerfile: Dockerfile
    container_name: delivery-management
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql-23d061c1-aravindrasakatla7-b9ba.e.aivencloud.com:19407/defaultdb?sslMode=REQUIRED}
      DB_USERNAME: ${DB_USERNAME:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_AUTO_STARTUP: "true"
    networks:
      - ecommerce-network

  # -----------------------------------------------------------
  # 7. Real-Time Tracking Microservice (Port 8085)
  # -----------------------------------------------------------
  tracking-service:
    build:
      context: ./TrackingService
      dockerfile: Dockerfile
    container_name: tracking-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql-23d061c1-aravindrasakatla7-b9ba.e.aivencloud.com:19407/defaultdb?sslMode=REQUIRED}
      DB_USERNAME: ${DB_USERNAME:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_HOST: eureka-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_AUTO_STARTUP: "true"
    networks:
      - ecommerce-network

  # -----------------------------------------------------------
  # 8. Agentic AI Customer Care Service (Port 8086)
  # -----------------------------------------------------------
  customer-care-service:
    build:
      context: ./CustomerCareService
      dockerfile: Dockerfile
    container_name: customer-care-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_AUTO_STARTUP: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    networks:
      - ecommerce-network

  # -----------------------------------------------------------
  # 9. Spring Cloud API Gateway (Port 9500)
  # -----------------------------------------------------------
  api-gateway:
    build:
      context: ./APIGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "9500:9500"
    depends_on:
      - eureka-service
    environment:
      EUREKA_HOST: eureka-service
      JWT_SECRET: ${JWT_SECRET:-SuperSecretDefaultKeyForDevelopmentOnly1234567890}
    networks:
      - ecommerce-network

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  ecommerce-network:
    driver: bridge
