spring.application.name=APIGateway

server.port=9500

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=UserManagement
spring.cloud.gateway.server.webflux.routes[0].uri=lb://UserManagement
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[1].id=ProductManagement
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ProductManagement
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/orders/**
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Path=/product/**

spring.cloud.gateway.server.webflux.routes[2].id=DeliveryManagement
spring.cloud.gateway.server.webflux.routes[2].uri=lb://DeliveryManagement
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/delivery/**




