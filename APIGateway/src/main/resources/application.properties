spring.application.name=APIGateway
server.port=9500

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/

# User Management Route
spring.cloud.gateway.server.webflux.routes[0].id=UserManagement
spring.cloud.gateway.server.webflux.routes[0].uri=lb://UserManagement
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# Product Management - Products Route
spring.cloud.gateway.server.webflux.routes[1].id=ProductManagement-Products
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ProductManagement
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product/**

# Product Management - Orders Route
spring.cloud.gateway.server.webflux.routes[2].id=ProductManagement-Orders
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ProductManagement
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders/**

# Delivery Management Route
spring.cloud.gateway.server.webflux.routes[3].id=DeliveryManagement
spring.cloud.gateway.server.webflux.routes[3].uri=lb://DeliveryManagement
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/delivery/**

# Inventory Management Route
spring.cloud.gateway.server.webflux.routes[4].id=InventoryManagement
spring.cloud.gateway.server.webflux.routes[4].uri=lb://InventoryManagement
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/inventory/**

# Tracking Service Route
spring.cloud.gateway.server.webflux.routes[5].id=TrackingService
spring.cloud.gateway.server.webflux.routes[5].uri=lb://TrackingService
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/tracking/**

# Driver & Fleet Route (routed to DeliveryManagement)
spring.cloud.gateway.server.webflux.routes[6].id=DeliveryManagement-Drivers
spring.cloud.gateway.server.webflux.routes[6].uri=lb://DeliveryManagement
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/drivers/**

# Customer Care AI Service Route
spring.cloud.gateway.server.webflux.routes[7].id=CustomerCareService
spring.cloud.gateway.server.webflux.routes[7].uri=lb://CustomerCareService
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/care/**

# JWT Secret for Edge Token Validation
jwt.secret=${JWT_SECRET:SuperSecretDefaultKeyForDevelopmentOnly1234567890}
