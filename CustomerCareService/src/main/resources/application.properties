spring.application.name=CustomerCareService
server.port=8086

# Google Gemini API Configuration (Free Tier)
gemini.api-key=${GEMINI_API_KEY:AIzaSyAmwwNDmlDgB2yDvYu5s2_kAQ7fU4ulUss}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

# Eureka client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/


# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=customer-care-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.auto-startup=${KAFKA_AUTO_STARTUP:false}
