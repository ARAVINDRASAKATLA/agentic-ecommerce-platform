name: CI/CD Pipeline - E-Commerce Agentic Microservices

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AIzaSyAmwwNDmlDgB2yDvYu5s2_kAQ7fU4ulUss' }}
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'SuperSecretDefaultKeyForDevelopmentOnly1234567890' }}
  KAFKA_AUTO_STARTUP: 'false'

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Unit / Integration Test Matrix
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: EurekaService
            java-version: '17'
          - service: APIGateway
            java-version: '17'
          - service: UserManagement
            java-version: '21'
          - service: InventoryManagement
            java-version: '21'
          - service: ProductManagement
            java-version: '21'
          - service: DeliveryManagement
            java-version: '21'
          - service: TrackingService
            java-version: '21'
          - service: CustomerCareService
            java-version: '21'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: |
          if [ -f "./${{ matrix.service }}/mvnw" ]; then
            chmod +x ./${{ matrix.service }}/mvnw
          fi

      - name: Build & Run Tests
        working-directory: ./${{ matrix.service }}
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw clean test -B
          else
            mvn clean test -B
          fi

  # -------------------------------------------------------------
  # Job 2: Docker Validation & Compose Build
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Compose Validation & Build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Test Build Docker Images
        run: docker compose build --parallel
